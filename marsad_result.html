<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مِرْصاد | MARSAD – Results</title>
<!-- ملف الطلاب والمعلمين: ضعه بجانب هذه الصفحة (يُستخدم لحساب نسب إنجاز الإدخال) -->
<script src="student_teachers_data.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ألوان بوابة الرازي الذكية */
  --ink:#1A1A1A;--muted:#6B6B6B;--line:#DDDDDA;--bg:#F2F2F0;--card:#fff;--clay:#C9A227;
  --brand:#2563EB;--brand-d:#1D4FBF;--brand-l:#E8EEFC;
  --l0:#E4E8EE;--l1:#C9D8F2;--l2:#93B2EA;--l3:#E6C35A;--l4:#C0702A;
  --s-none:#2F6B4F;--s-watch:#2563EB;--s-follow:#B8860B;--s-prio:#7A2E2E;
  --radius:0;--shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.65;font-size:14.5px}
button,select,input{font:inherit;color:inherit}
.side{position:fixed;inset-block:0;inset-inline-start:0;width:248px;background:linear-gradient(180deg,var(--brand-d),var(--brand));color:#fff;display:flex;flex-direction:column;z-index:30;overflow:auto}
.brand{padding:20px 18px 12px}
.brand h1{margin:0;font-size:24px;line-height:1.2}
.brand p{margin:4px 0 0;font-size:12.5px;opacity:.85}
.brand small{opacity:.7;font-size:12px}
.nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{background:none;border:0;color:#fff;text-align:start;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;opacity:.88}
.nav button:hover{background:rgba(255,255,255,.12);opacity:1}
.nav button.on{background:rgba(255,255,255,.2);opacity:1;font-weight:600}
.nav .ic{width:22px;text-align:center}
.nav button:disabled{opacity:.35;cursor:not-allowed}
.sfoot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.18);display:flex;gap:8px;flex-wrap:wrap}
.sfoot button{flex:1;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:8px;cursor:pointer}
.sfoot button:hover{background:rgba(255,255,255,.28)}
main{margin-inline-start:248px;padding:22px 24px 60px;max-width:1280px}
h2.pt{margin:0 0 4px;font-size:24px}
.ps{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.card h3{margin:0 0 4px;font-size:17px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:28px;line-height:1.2;color:var(--brand-d)}
.stat span{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--brand-l)}
.btn.sm{padding:6px 12px;font-size:13px}
.drop{border:2px dashed #9cc3cd;background:var(--brand-l);border-radius:var(--radius);padding:28px;text-align:center}
.drop.over{background:#cfe9ef;border-color:var(--brand)}
.drop .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.note{border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0;background:var(--brand-l);border:1px solid #bfdde4;color:var(--brand-d)}
.note.warn{background:#fff6df;border-color:#f0d58a;color:#6d4c05}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,42%) 1fr 54px;gap:10px;align-items:center;cursor:pointer;border-radius:8px;padding:2px 4px}
.bar:hover{background:#f0f5f8}
.bar .lb{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:16px;background:var(--l0);border-radius:99px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .vl{font-size:13px;color:var(--muted);text-align:end}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-2px}
.tb{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tb input{border:1px solid #c9d3de;border-radius:10px;padding:8px 12px;min-width:220px;background:#fff}
.tb select{border:1px solid #c9d3de;border-radius:10px;padding:8px 10px;background:#fff}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:#f6f9fb;text-align:start;padding:9px 10px;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;border-bottom:1px solid var(--line)}
table.t th:hover{background:var(--brand-l)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr[data-student]:hover,table.t tr[data-class]:hover{background:#f3f9fb;cursor:pointer}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap}
.b-none{background:var(--s-none)}.b-watch{background:var(--s-watch)}.b-follow{background:var(--s-follow)}.b-prio{background:var(--s-prio)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--brand-l);color:var(--brand-d);font-size:12.5px;margin:1px}
.ok{color:#2e7d5b}.bad{color:#b3332f}
.mx td.c{text-align:center;font-size:12.5px;min-width:74px}
.l0{background:var(--l0)}.l1{background:var(--l1)}.l2{background:var(--l2)}.l3{background:var(--l3)}.l4{background:var(--l4);color:#fff}
.insights li{margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(20,35,50,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:var(--radius);max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--brand-l);border-radius:99px;padding:3px 12px;font-size:13px}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.stuhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stuhead h2{margin:0}
.no-print{}
@media(max-width:980px){
  .side{position:static;width:auto;flex-direction:row;align-items:center;flex-wrap:wrap}
  .nav{flex-direction:row;overflow:auto;flex:1 1 100%;order:3}
  .nav button{white-space:nowrap}
  main{margin-inline-start:0;padding:16px}
  .g2{grid-template-columns:1fr}
}
@media print{
  .side,.no-print,.tb{display:none!important}
  main{margin:0;padding:0}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;border-inline-start:5px solid var(--brand);display:flex;flex-direction:column;gap:2px}
.kpi:hover{background:#f6fafc}
.kpi .kl{font-size:13px;color:var(--muted)}
.kpi b{font-size:30px;line-height:1.2;color:var(--brand-d)}
.kpi small{color:var(--muted);font-size:12.5px;line-height:1.45}
.kpi.t2{border-inline-start-color:#c47a12}.kpi.t3{border-inline-start-color:#2f5fb3}.kpi.t4{border-inline-start-color:#2e8a5b}.kpi.t5{border-inline-start-color:#7a4fa3}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;cursor:pointer;font-size:13.5px}
.seg button:hover{background:var(--brand-l)}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
td.cdone{background:rgba(46,138,91,.22)}td.cprog{background:rgba(242,200,121,.45)}td.cnone{background:#eef2f6;color:#8a97a5}
.cmp td.c{text-align:center;min-width:82px;font-size:13px;line-height:1.3}.cmp th{white-space:normal;min-width:82px;font-size:12.5px}
.cmp small{color:var(--muted)}
.cmp td.sl{text-align:start;min-width:150px;font-size:13px}
td.cunav{background:repeating-linear-gradient(45deg,#f3f5f8,#f3f5f8 6px,#e9edf2 6px,#e9edf2 12px);color:#8a97a5}
tr.unav td.sl{color:#8a97a5}
h4.gt{margin:16px 0 6px;color:var(--brand-d);font-size:15px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;margin-inline-start:10px;cursor:pointer}
td.ex{opacity:.55;font-style:italic}
.pbar{height:10px;background:var(--l0);border-radius:99px;overflow:hidden;min-width:90px}.pbar i{display:block;height:100%;background:var(--s-none)}
.b-grey{background:#8a97a5}.b-opt{background:#7a4fa3}
.rcfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:10px}
.rcfg label{font-size:13px;color:var(--muted);display:block}
.rcfg input{width:100%;border:1px solid #c9d3de;border-radius:8px;padding:7px 10px;background:#fff}
.rwrap{overflow:auto;padding:12px;background:#e6ebf0;border-radius:12px}
.page{width:210mm;height:296mm;padding:10mm 13mm 8mm;background:#fff;margin:0 auto 14px;box-shadow:0 2px 12px rgba(0,0,0,.18);overflow:hidden;position:relative;font-size:10.4pt;line-height:1.5;color:#111;display:flex;flex-direction:column;direction:rtl;font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif}
.page *{box-sizing:border-box}
.rh{border:1.6px solid #1D3F8F;border-radius:6px;overflow:hidden;margin-bottom:5px}
.rh-top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1D3F8F;color:#fff}
.rh-school{font-weight:700;font-size:12pt;flex:1}
.rh-title{flex:2;text-align:center;font-weight:700;font-size:13.5pt;line-height:1.3}
.rh-title small{display:block;font-weight:400;font-size:9pt;opacity:.92}
.rh-date{flex:1;text-align:end;font-size:9pt}
.rh-sign{display:flex;justify-content:space-between;padding:5px 12px;background:#E8EEFC;font-size:9.6pt}
.rh2{display:flex;justify-content:space-between;align-items:center;border-bottom:1.6px solid #1D3F8F;padding-bottom:4px;margin-bottom:4px;font-size:9.5pt}
.rs{font-weight:700;font-size:11.5pt;color:#1D3F8F;border-bottom:1.5px solid #1D3F8F;margin:7px 0 4px;padding-bottom:1px}
.ri{display:grid;grid-template-columns:2.2fr 1.2fr .8fr 1fr;border:1px solid #9fb4bb;border-radius:5px;overflow:hidden}
.ri div{padding:4px 8px;border-inline-end:1px solid #cfdadd}.ri div:last-child{border:0}.ri small{display:block;color:#555;font-size:8pt}
.rt{width:100%;border-collapse:collapse;font-size:9.6pt}
.rt th,.rt td{border:1px solid #9fb4bb;padding:3.6px 5px}
.rt th{background:#E8EEFC;font-weight:700;text-align:center;font-size:9pt}
.rt td.n{width:6mm;text-align:center;color:#555}
.rt td.lv{width:11mm;text-align:center;font-size:10pt;padding:0}
.rt td.on{background:#cfd9dd}
.rt td.sb{width:26mm;font-size:8.2pt;color:#333}
.rt tr:nth-child(even) td{background:#f9fbfb}.rt tr:nth-child(even) td.on{background:#cfd9dd}
.rl{font-size:8.6pt;color:#444;margin-top:3px}
.rpara{margin:3px 0;text-align:justify}
.rul{margin:2px 0;padding-inline-start:16px}.rul li{margin:1.5px 0}
.rsig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:auto;text-align:center;font-size:9pt}
.rsig div{border-top:1px solid #333;padding-top:3px;margin-top:20px}
.rfoot{border-top:1px solid #9fb4bb;margin-top:6px;padding-top:3px;font-size:7.8pt;color:#555;display:flex;justify-content:space-between}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rwrap{padding:0;background:none;overflow:visible;border-radius:0}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
/* ===== نمط بوابة الرازي الذكية / برنامج الحضور ===== */
h1,h2,h3,h4,.brand h1{font-family:"El Messiri","IBM Plex Sans Arabic",sans-serif}
.side{background:#fff;color:var(--ink);border-inline-end:1px solid var(--line);box-shadow:none}
.brand{border-bottom:1px solid var(--line);text-align:center;padding:18px 14px 12px}
.brand-logo{height:64px;width:auto;display:block;margin:0 auto 8px}
.brand h1{font-size:22px;color:var(--ink)}
.brand p{color:var(--brand);font-weight:700;opacity:1}
.brand small{color:var(--muted);opacity:1}
.nav{padding:10px 0;gap:0}
.nav button{color:var(--ink);border-radius:0;opacity:1;border-inline-start:3px solid transparent;padding:10px 16px}
.nav button:hover{background:var(--brand-l)}
.nav button.on{background:var(--brand-l);color:var(--brand-d);border-inline-start-color:var(--clay);font-weight:700}
.sfoot{border-top:1px solid var(--line)}
.sfoot button{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:0;font-weight:600}
.sfoot button:hover{background:var(--brand-l);border-color:var(--brand)}
h2.pt{font-size:23px;border-inline-start:4px solid var(--clay);padding-inline-start:10px}
.card,.stat,.kpi{box-shadow:none}
.kpi{border-inline-start-width:4px}
.kpi.t2{border-inline-start-color:var(--clay)}.kpi.t3{border-inline-start-color:var(--brand)}.kpi.t4{border-inline-start-color:var(--s-none)}.kpi.t5{border-inline-start-color:var(--s-prio)}
.kpi:hover,table.t tr[data-student]:hover,table.t tr[data-class]:hover{background:var(--brand-l)}
.btn{border-radius:0;border-bottom:2px solid var(--clay)}
.btn.ghost{border-bottom:1px solid var(--line)}
.btn.sm{border-bottom-width:1px}
.seg button{border-radius:0}
.badge,.pill,.chip{border-radius:0}
.bar .tr,.pbar{border-radius:0}.bar{border-radius:0}.bar:hover{background:var(--brand-l)}
.tw{border-radius:0}
table.t th{background:#FAFAF8}
table.t th:hover{background:var(--brand-l)}
.tb input,.tb select,.rcfg input{border-radius:0;border-color:var(--line)}
.note{border-radius:0}
.note.warn{background:#FBF3D9;border-color:#E7D7A3;color:#8A6A1E}
.drop{border-radius:0;border-color:var(--brand);background:var(--brand-l)}
.drop.over{background:#D5E1FA}
.modal .box{border-radius:0}
.rwrap{border-radius:0;background:#E6E6E2}
td.cdone{background:rgba(47,107,79,.2)}td.cprog{background:rgba(201,162,39,.28)}
.b-opt{background:var(--s-prio)}
/* ===== الترويسة والتبويبات في الأعلى ===== */
.side{position:sticky;top:0;inset-block:auto;inset-inline:auto;width:auto;flex-direction:row;align-items:center;gap:6px;padding:0 16px;overflow:visible;border-inline-end:0;border-bottom:1px solid var(--line);z-index:40}
.brand{display:flex;align-items:center;gap:10px;border:0;padding:6px 0;text-align:start;flex:none}
.brand .brand-logo{height:46px;margin:0}
.brand h1{font-size:20px;margin:0}
.brand p{display:none}
.brand small{display:block;font-size:11.5px}
.nav{flex-direction:row;flex:1;overflow-x:auto;padding:0 8px;gap:0;order:0}
.nav button{border-inline-start:0;border-bottom:3px solid transparent;padding:16px 12px;white-space:nowrap}
.nav button.on{border-inline-start-color:transparent;border-bottom-color:var(--clay)}
.sfoot{border:0;padding:0;flex:none}.sfoot button{flex:none;padding:6px 14px}
main{margin-inline-start:0;max-width:none;padding:18px 22px 60px}
.nav button{padding:16px 9px;font-size:13.5px;gap:5px}.brand small{display:none}
.mxc{width:auto!important}
/* ===== خط متدرج ===== */
.gl{position:relative;direction:rtl;height:9px;border-radius:5px;background:linear-gradient(270deg,#2F6B4F,#E6C35A 50%,#C0392B);margin:8px 9px;min-width:110px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.gd{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px -7.5px 0 0;border-radius:50%;background:#fff;border:3px solid #1A1A1A;box-sizing:border-box}
.gll{display:flex;justify-content:space-between;font-size:9pt;font-weight:600;direction:rtl;padding:0 2px;white-space:nowrap}
.mx td.gcell{min-width:170px}.mxs th{min-width:170px}
.rt th.gc,.rt td.gc{width:62mm;padding:2px 6px}
.rt td.gc .gl{margin:6px 8px}
/* ===== جدول الطالب بالألوان ===== */
.mx td:first-child,.mx th:first-child{white-space:nowrap}
.mxc td.c{min-width:0;width:34px;height:30px;padding:0;border-inline-start:1px solid #fff}
.mx td.m0{background:#BFE0CB}.mx td.m2{background:#F3D98B}.mx td.m4{background:#DE7F6B}
.mx td.cx{background:repeating-linear-gradient(45deg,#f3f5f8,#f3f5f8 4px,#e4e8ee 4px,#e4e8ee 8px)}
.mx td.ex{outline:2px dashed #444;outline-offset:-3px}
th.rot{height:190px;width:34px;min-width:34px;padding:4px 0;vertical-align:bottom;cursor:default;text-align:center;white-space:normal}
th.rot div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;margin:0 auto;font-size:12.5px;font-weight:600;max-height:180px;overflow:hidden}
.mxlg{align-items:center;margin:6px 0}
.mxlg i{width:18px;height:14px;border-radius:0;vertical-align:-2px}
.mxlg .k0{background:#BFE0CB}.mxlg .k2{background:#F3D98B}.mxlg .k4{background:#DE7F6B}
.mxlg .kx{background:repeating-linear-gradient(45deg,#f3f5f8,#f3f5f8 3px,#d9dee6 3px,#d9dee6 6px)}
.mxlg .ke{background:#fff;border:2px dashed #444}
/* ===== الصفوف والشعب (بطاقات مرئية) ===== */
.gh2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.gh2 h3{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ctile{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-inline-start:5px solid var(--c);background:#fff;padding:14px;cursor:pointer;transition:.12s}
.ctile:hover{background:var(--brand-l);transform:translateY(-2px)}
.ring{width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),#E4E8EE 0);display:grid;place-items:center;flex:none}
.ring b{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;color:var(--c)}
.ring.sm{display:inline-grid;width:20px;height:20px;vertical-align:-5px}.ring.sm b{width:10px;height:10px}
.cinfo{flex:1;min-width:0}.cinfo h4{margin:0;font-size:20px;font-family:"El Messiri",sans-serif}.cinfo small{color:var(--muted)}
.stack{display:flex;height:18px;margin:7px 0;background:#E4E8EE}.stack i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-style:normal;min-width:16px}
.mini{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.top{font-size:12.5px;margin-top:5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clegend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px}
.clegend i{display:inline-block;width:14px;height:14px;margin-inline-end:5px;vertical-align:-2px}
.clegend .clv i{margin-inline-start:8px}
@media print{
  .side{display:none!important}
  main{margin:0!important;padding:0!important;max-width:none!important}
  .rwrap{background:none!important;padding:0!important;overflow:visible!important}
  .page{margin:0!important;box-shadow:none!important}
}

.cl .clh{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;padding:6px 2px;flex-wrap:wrap}
.cl .clh h3,.cl .clh h4{margin:0}
.cl .arr::before{content:"▾";display:inline-block;width:18px;color:var(--brand);font-size:16px}
.cl.closed .arr::before{content:"◂"}
[dir=ltr] .cl.closed .arr::before{content:"▸"}
.cl.closed .clbody{display:none}
.cl .clbar{display:none;flex:1;min-width:200px;max-width:420px}
.cl.closed .clbar{display:block}
.lb{display:flex;align-items:center;gap:10px}
.lbt{flex:1;height:14px;background:#e6e9ee;border:1px solid var(--line);overflow:hidden;position:relative}
.lbt i{display:block;height:100%;background:repeating-linear-gradient(135deg,#2F6B4F 0 10px,#3d8062 10px 20px);background-size:28px 28px;animation:lbmove 1s linear infinite}
@keyframes lbmove{to{background-position:28px 0}}
.lb span{white-space:nowrap;font-size:13px}
.cmp th{text-align:center!important}.cmp th:first-child{text-align:start!important}
h5.sh{margin:14px 0 8px;font-size:14px;color:var(--brand-d)}
.tops{display:grid;gap:6px}
.tp{display:grid;grid-template-columns:24px minmax(160px,1.2fr) 3fr 44px;gap:10px;align-items:center;font-size:13px}
.tp .rk{background:var(--brand);color:#fff;text-align:center;font-size:12px}
.tp .tn small{display:block;color:var(--muted);font-size:11.5px}
.tp .tr{height:12px;background:#e6e9ee}.tp .tr i{display:block;height:100%;background:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.cchip{display:inline-flex;gap:5px;align-items:center;padding:2px 8px;font-size:12px;border:1px solid transparent}
.cchip small{font-size:10.5px;opacity:.85}
.cchip.cd{background:#2F6B4F;color:#fff}.cchip.cp{background:#FBEFCF;color:#6b4e00;border-color:#E0A82E}.cchip.co{background:#E4ECF7;color:#26466d;border-color:#9DB4D6}.cchip.cn{background:#eee;color:#777}
.scp{display:inline-flex;align-items:baseline;gap:2px;padding:2px 10px;border:1px solid;font-size:14px;white-space:nowrap}
.scp small{font-size:11px;opacity:.8}.scp.none{border-color:#ddd;color:#999}
.scb{display:flex;align-items:center;gap:8px;min-width:120px}.scb b{width:30px;text-align:center}
.sctr{flex:1;height:12px;background:#e6e9ee}.sctr i{display:block;height:100%}
.dotp{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;margin-inline-end:4px}
.clegend2{display:flex;gap:22px;align-items:center;flex-wrap:wrap;font-size:13px}
.clegend2 .dotp{width:30px;height:30px;font-size:10px}
.sq{display:inline-block;width:13px;height:13px;margin-inline:8px 4px;vertical-align:-2px}
.ctab td{vertical-align:middle}.ctab tr.clk{cursor:pointer}.ctab tr.clk:hover{background:var(--brand-l)}
.ctab tr.grow td{background:#EEF1F6;border-top:2px solid var(--brand)}
.ctab .cn2{font-size:16px}.ctab td.tp2{font-size:12.5px;color:#7A2E2E;min-width:180px}
.ctab .stack{min-width:150px}
.scbig{display:inline-flex;align-items:center;gap:6px}.scbig em{font-style:normal;color:var(--muted);font-size:13px}.scbig .scp{font-size:20px;padding:4px 14px}
th.c{text-align:center!important}
@media print{
  .noprint2{display:none!important}
  #srep{width:210mm;box-sizing:border-box;padding:7mm 8mm;margin:0 auto}
  #srep .card{border:1px solid #bbb;box-shadow:none;padding:8px 10px;margin:0 0 6px}
  #srep .tw{overflow:visible!important}
}
#srep.pfit{width:210mm;box-sizing:border-box}
</style>
</head>

async function idbSet(k, v) { try { const d = await idb(); await new Promise((res, rej) => { const tx = d.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) {} }
async function idbGet(k) { try { const d = await idb(); return await new Promise((res, rej) => { const rq = d.transaction("kv").objectStore("kv").get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); } catch (e) { return null; } }

function levelOf(a) { if (a == null) return undefined; if (typeof a === "number") return (a >= 0 && a <= 4) ? a : undefined; return Object.prototype.hasOwnProperty.call(LV, a) ? LV[a] : undefined; }

function validate(j) {
  const E = [];
  if (!j || typeof j !== "object" || Array.isArray(j)) return { errors: [["r_obj"]] };
  if (j.app && String(j.app).toLowerCase() !== "marsad") E.push(["r_app"]);
  if (!j.app && !j.behavioral) E.push(["r_app"]);
  const st = j.student || {};
  if (!st.name && !st.id) E.push(["r_student"]);
  if (!j.teacher || !j.teacher.name) E.push(["r_teacher"]);
  if (!j.subject || !j.subject.name) E.push(["r_subject"]);
  const lv = {};
  const readList = (arr, prefix, key) => {
    if (!Array.isArray(arr) || !arr.length) { E.push([key]); return; }
    arr.forEach(it => {
      const code = it && it.code;
      if (!code || !CODES.includes(code)) return;
      const l = levelOf(it.answer != null ? it.answer : it.frequencyLevel);
      if (l === undefined) E.push(["r_ans", code]);
      else { lv[code] = l; if (!ITEMS[code]) ITEMS[code] = {}; if (it.statementAr) ITEMS[code].ar = it.statementAr; if (it.statementEn) ITEMS[code].en = it.statementEn; }
    });
    if (!arr.some(it => it && String(it.code || "").startsWith(prefix))) E.push([key]);
  };
  readList(j.behavioral, "B", "r_beh");
  readList(j.academic, "A", "r_aca");
  if (E.length) return { errors: E };
  const fu = j.followUp || {};
  const rec = {
    responseId: String(j.responseId || ""), submittedAt: Date.parse(j.submittedAt) || 0, lang: j.formLanguage || "",
    teacher: String(j.teacher.name).trim(), subject: String(j.subject.name).trim(),
    student: { id: st.id ? String(st.id).trim() : "", name: String(st.name || "").replace(/\s+/g, " ").trim(), grade: String(st.grade || ""), section: String(st.section || "") },
    lv: lv, parent: fu.parentContacted && fu.parentContacted.answer || "", social: fu.needsSocialWorker && fu.needsSocialWorker.answer || "",
    strengths: String(j.strengths || "").trim(), notes: String(j.additionalNotes || "").trim()
  };
  if (!rec.responseId) rec.responseId = "gen-" + rec.teacher + "|" + rec.subject + "|" + (rec.student.id || rec.student.name) + "|" + rec.submittedAt;
  return { errors: [], rec };
}

const skeyOf = s => s.id ? "id:" + s.id : "nm:" + s.name + "|" + s.grade + "|" + s.section;
const respKey = r => [r.teacher, r.subject, skeyOf(r.student)].join("||");

/* ملف الشعبة (classBatch): يُحوَّل كل طالب فيه إلى سجل مستقل */
function expandBatch(j, fileName) {
  const out = [];
  const tn = String(j.teacher && j.teacher.name || "").trim(), sn = String(j.subject && j.subject.name || "").trim();
  const cl = j.class || {}, gr = String(cl.grade || ""), sc = String(cl.section || "");
  const at = Date.parse(j.exportedAt) || 0;
  Object.keys(j.statements || {}).forEach(c => { if (CODES.includes(c)) { ITEMS[c] = ITEMS[c] || {}; if (j.statements[c].ar) ITEMS[c].ar = j.statements[c].ar; if (j.statements[c].en) ITEMS[c].en = j.statements[c].en; } });
  (j.students || []).forEach(s => {
    const st = { id: s.id ? String(s.id).trim() : "", name: String(s.name || "").replace(/\s+/g, " ").trim(), grade: gr, section: sc };
    const label = fileName + " › " + (st.name || st.id);
    if (!tn || !sn || !gr || !sc || (!st.id && !st.name)) { out.push({ label: label, errors: [["r_student"]] }); return; }
    if (s.status === "partial") { out.push({ label: label, errors: [["r_partial"]] }); return; }
    const lv = {};
    if (s.status !== "na") {
      Object.keys(s.answers || {}).forEach(c => { if (CODES.includes(c)) { const l = levelOf(s.answers[c]); if (l !== undefined) lv[c] = l; } });
      if (!BEH.some(c => lv[c] !== undefined) || !ACA.some(c => lv[c] !== undefined)) { out.push({ label: label, errors: [["r_partial"]] }); return; }
    }
    const fu = s.followUp || {};
    const sub = Date.parse(s.updatedAt) || at;
    const fv = x => x && (typeof x === "object" ? x.answer : x) || "";
    out.push({ label: label, rec: { responseId: "b|" + tn + "|" + sn + "|" + gr + "-" + sc + "|" + (st.id || st.name) + "|" + sub, submittedAt: sub, lang: j.formLanguage || "",
      teacher: tn, subject: sn, student: st, lv: lv, na: s.status === "na", parent: fv(fu.parentContacted), social: fv(fu.needsSocialWorker),
      strengths: String(s.strengths || "").trim(), notes: String(s.additionalNotes || "").trim(), fileName: fileName } });
  });
  return out;
}
async function handleFiles(list) {
  const files = Array.from(list || []);
  const log = []; let nonJson = 0;
  const byKey = {}; Object.values(STORE).forEach(r => byKey[respKey(r)] = r);
  for (const f of files) {
    const path = f.webkitRelativePath || f._path || f.name;
    if (!/\.json$/i.test(f.name)) { nonJson++; continue; }
    let cands = [];
    try {
      let j;
      const txt = await readText(f).catch(() => { throw ["r_read"]; });
      try { j = JSON.parse(txt.replace(/^﻿/, "")); } catch (x) { throw ["r_json"]; }
      if (j && j.type === "classBatch" && Array.isArray(j.students)) cands = expandBatch(j, f.name);
      else { const v = validate(j); cands = [v.errors.length ? { label: path, errors: v.errors } : { label: path, rec: Object.assign(v.rec, { fileName: f.name }) }]; }
    } catch (x) { cands = [{ label: path, errors: [Array.isArray(x) ? x : ["r_read"]] }]; }
    cands.forEach(cd => {
      const e = { path: cd.label, status: "invalid", reason: [] };
      if (cd.errors) { e.reason = cd.errors; if (cd.errors[0][0] === "r_partial") e.status = "dups"; }
      else {
        const rec = cd.rec, k = respKey(rec);
        if (STORE[rec.responseId]) { e.status = "dupf"; e.reason = [["r_same"]]; }
        else if (byKey[k]) {
          const old = byKey[k];
          if (rec.submittedAt > old.submittedAt) { delete STORE[old.responseId]; STORE[rec.responseId] = rec; byKey[k] = rec; e.status = "upd"; e.reason = [["r_replaced"]]; }
          else { e.status = "dups"; e.reason = [["r_newer"]]; }
        } else { STORE[rec.responseId] = rec; byKey[k] = rec; e.status = "new"; }
      }
      log.push(e);
    });
  }
  LASTIMP = { log: log, nonJson: nonJson, found: log.length };
  analyze(); persist();
  VIEW = "import"; render();
}

async function filesFromDrop(dt) {
  const out = [];
  const walk = (entry, path) => new Promise(res => {
    if (entry.isFile) entry.file(f => { f._path = path + f.name; out.push(f); res(); }, () => res());
    else if (entry.isDirectory) {
      const rd = entry.createReader(); const all = [];
      const rdAll = () => rd.readEntries(async es => { if (!es.length) { for (const x of all) await walk(x, path + entry.name + "/"); res(); } else { all.push(...es); rdAll(); } }, () => res());
      rdAll();
    } else res();
  });
  const items = dt.items ? Array.from(dt.items) : [];
  if (items.length && items[0].webkitGetAsEntry) { for (const it of items) { const en = it.webkitGetAsEntry(); if (en) await walk(en, ""); } return out; }
  return Array.from(dt.files || []);
}


function parseStudent(raw) {
  const m = String(raw).match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  return { raw: String(raw), name: (m ? m[1] : String(raw)).replace(/\s+/g, " ").trim(), id: m ? m[2].trim() : "" };
}

}
function loadRosterFile(file) {

}

const grpOf = x => inList(x, CFG.GROUP_A) ? "A" : inList(x, CFG.GROUP_B) ? "B" : "O";

function computeCompletion() {
  const subs0 = [];

  A.recs.forEach(r => { const o = TK(r.teacher), ck = r.student.grade + "-" + r.student.section, sk = skeyOf(r.student); o.subjects.add(r.subject); o.pairs.add(ck + "|" + nz(r.subject) + "|" + sk); (o.byCls[ck] = o.byCls[ck] || new Set()).add(sk); });

      cls: Object.keys(o.byCls).sort((a, b) => { const x = a.split("-").map(Number), y = b.split("-").map(Number); return x[0] - y[0] || x[1] - y[1]; }).map(ck => ({ ck: ck, n: o.byCls[ck].size, N: N[ck] || 0 })) };
  }).sort((a, b) => subjRank(a.subjects[0] || "") - subjRank(b.subjects[0] || "") || String(a.name).localeCompare(String(b.name), "ar"));
  let noEntry = 0;
  if (ROSTER) Object.keys(rk).forEach(ck => rk[ck].forEach(k => { if (!A.students.has(k)) noEntry++; }));
  A.comp = { classes: classes, subjects: subs, rows: rows, cell: cell, cls: cls, sj: sj, inScope: inScope, overall: { n: on, N: oN, p: oN ? Math.round(on / oN * 100) : 0 }, noEntry: noEntry, hasRoster: !!ROSTER, teachers: teachers, N: N };
}

function analyze() {
  const recs = Object.values(STORE).filter(r => !r.na);   // الطالب غير الملحوظ لا يُحتسب
  A = { recs: recs, students: new Map(), teachers: new Set(), subjects: new Set(), items: {}, classes: {}, subj: {} };
  CODES.forEach(c => A.items[c] = { code: c, counts: [0, 0, 0, 0, 0], n: 0, stu: new Set(), bySubj: {} });
  recs.forEach(r => {
    A.teachers.add(r.teacher); A.subjects.add(r.subject);
    const k = skeyOf(r.student);
    if (!A.students.has(k)) A.students.set(k, { key: k, id: r.student.id, name: r.student.name, grade: r.student.grade, section: r.student.section, resp: [], lowRel: !r.student.id });
    A.students.get(k).resp.push(r);
    CODES.forEach(c => {
      const l = r.lv[c]; if (l === undefined) return;
      const it = A.items[c]; it.counts[l]++; it.n++;
      if (l >= CFG.FLAG_LEVEL) it.stu.add(k);
      const bs = it.bySubj[r.subject] = it.bySubj[r.subject] || { n: 0, f: 0 }; bs.n++; if (l >= CFG.FLAG_LEVEL) bs.f++;
    });
    const sj = A.subj[r.subject] = A.subj[r.subject] || { name: r.subject, resp: 0, stu: new Set(), beh: [], aca: [], n: 0, f: 0 };
    sj.resp++; sj.stu.add(k);
    CODES.forEach(c => { const l = r.lv[c]; if (l === undefined) return; (c[0] === "B" ? sj.beh : sj.aca).push(l); sj.n++; if (l >= CFG.FLAG_LEVEL) sj.f++; });
  });
  A.students.forEach(computeStudent);
  // الشعب
  A.students.forEach(s => {
    const ck = clsName(s.grade, s.section);
    const c = A.classes[ck] = A.classes[ck] || { key: ck, grade: s.grade, section: s.section, stu: [], resp: 0, beh: [], aca: [], bs: [], as: [], follow: 0, top: {} };
    c.stu.push(s); c.resp += s.resp.length; c.beh.push(...s.behAll); c.aca.push(...s.acaAll);
    if (s.level >= 2) c.follow++;
    if (s.behScore != null) c.bs.push(s.behScore); if (s.acaScore != null) c.as.push(s.acaScore);
    s.flagged.forEach(x => c.top[x] = (c.top[x] || 0) + 1);
  });
  // اتفاق المعلمين
  const ag = []; A.students.forEach(s => { if (s.agree != null) ag.push(s.agree); });
  A.agree = ag.length ? Math.round(mean(ag) * 100) : null;
  SK.length = 0; A.students.forEach(s => SK.push(s.key));
  computeCompletion();
}

/* التقييم من 10: لكل بند نأخذ متوسط كل مادة (متوسط معلميها) ثم متوسط المواد؛ الأعباء = متوسط (المستوى/4) للبنود المرصودة؛
   التقييم = 10 × (1 − العبء) − 0.3 لكل بند بإجماع معلمَين فأكثر (بحد أقصى 1.5) */
function scoreOf(s, pre) {
  const ps = []; let pen = 0;
  CODES.filter(c => c[0] === pre).forEach(c => {
    const m = {}; s.resp.forEach(r => { if (r.lv[c] !== undefined) (m[r.subject] = m[r.subject] || []).push(r.lv[c]); });
    const k = Object.keys(m); if (!k.length) return;
    ps.push(mean(k.map(x => mean(m[x]))) / 4);
    if (new Set(s.resp.filter(r => r.lv[c] >= CFG.FLAG_LEVEL).map(r => r.teacher)).size >= 2) pen++;
  });
  if (!ps.length) return null;
  return Math.max(0, Math.round((10 * (1 - mean(ps)) - Math.min(1.5, pen * 0.3)) * 10) / 10);
}
const scCol = v => { const h = Math.round(Math.max(0, Math.min(10, v)) * 12); return { b: `hsl(${h},62%,44%)`, bg: `hsl(${h},70%,90%)`, tx: `hsl(${h},70%,22%)` }; };
const scPill = v => { if (v == null) return `<span class="scp none">—</span>`; const c = scCol(v); return `<span class="scp" style="background:${c.bg};color:${c.tx};border-color:${c.b}"><b>${v.toFixed(1)}</b><small>/10</small></span>`; };
const scBar = v => { if (v == null) return `<span class="scp none">—</span>`; const c = scCol(v); return `<div class="scb"><b style="color:${c.tx}">${v.toFixed(1)}</b><div class="sctr"><i style="width:${v * 10}%;background:${c.b}"></i></div></div>`; };
function computeStudent(s) {
  s.entries = {}; s.behAll = []; s.acaAll = []; s.teachers = new Set(s.resp.map(r => r.teacher));
  CODES.forEach(c => s.entries[c] = []);
  s.resp.forEach(r => CODES.forEach(c => {
    const l = r.lv[c]; if (l === undefined) return;
    s.entries[c].push({ teacher: r.teacher, subject: r.subject, level: l });
    (c[0] === "B" ? s.behAll : s.acaAll).push(l);
  }));
  s.flagged = CODES.filter(c => s.entries[c].some(e => e.level >= CFG.FLAG_LEVEL));
  s.consensus = CODES.filter(c => new Set(s.entries[c].filter(e => e.level >= CFG.FLAG_LEVEL).map(e => e.teacher)).size >= 2);
  s.single = s.flagged.filter(c => !s.consensus.includes(c));
  s.behScore = scoreOf(s, "B"); s.acaScore = scoreOf(s, "A");
  s.behIdx = r1(mean(s.behAll)); s.acaIdx = r1(mean(s.acaAll));
  s.socialBy = Array.from(new Set(s.resp.filter(r => r.social === "yes").map(r => r.teacher)));
  s.parentNoBy = Array.from(new Set(s.resp.filter(r => r.parent === "no").map(r => r.teacher)));
  s.aggr = s.entries.B11.some(e => e.level >= CFG.FLAG_LEVEL);
  s.aggrMax = Math.max(-1, ...s.entries.B11.map(e => e.level));
  s.why = [];
  const urgent = s.aggrMax === 4 || (s.aggr && s.socialBy.length >= 1) || s.socialBy.length >= 2;
  const high = s.consensus.length >= 3 || s.flagged.length >= 8 || (s.socialBy.length >= 1 && s.flagged.length >= 3);
  const watch = s.flagged.length >= 3 || s.consensus.length >= 1;
  s.level = urgent ? 3 : high ? 2 : watch ? 1 : 0;
  if (s.aggr) s.why.push("w_aggr"); if (s.socialBy.length) s.why.push("w_soc"); if (s.consensus.length) s.why.push("w_cons"); if (s.flagged.length >= 8) s.why.push("w_many");
  // الاتفاق: نسبة العناصر التي تباعد فيها المعلمون بدرجة ≤ 1
  if (s.resp.length >= 2) {
    let ok = 0, tot = 0;
    CODES.forEach(c => { const ls = s.entries[c].map(e => e.level); if (ls.length >= 2) { tot++; if (Math.max(...ls) - Math.min(...ls) <= 1) ok++; } });
    s.agree = tot ? ok / tot : null;
  } else s.agree = null;
  s.strengths = s.resp.filter(r => r.strengths).map(r => ({ teacher: r.teacher, subject: r.subject, text: r.strengths }));
  s.notes = s.resp.filter(r => r.notes).map(r => ({ teacher: r.teacher, subject: r.subject, text: r.notes }));
}

const med = a => { const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
/* ردود الطالب على عنصر معيّن، مع تعليم الردود البعيدة عن الوسيط (تتطلب 3 ردود فأكثر) */
function respLevels(s, c) {
  const arr = s.resp.filter(r => r.lv[c] !== undefined);
  if (!EXCL || arr.length < 3) return arr.map(r => ({ r: r, l: r.lv[c], out: false }));
  const m = med(arr.map(r => r.lv[c]));
  return arr.map(r => ({ r: r, l: r.lv[c], out: Math.abs(r.lv[c] - m) >= CFG.OUTLIER_GAP }));
}
const exCount = s => CODES.reduce((n, c) => n + respLevels(s, c).filter(o => o.out).length, 0);

  const m = {};
  respLevels(s, c).forEach(o => { if (!o.out) (m[o.r.subject] = m[o.r.subject] || []).push(o.l); });
  return Object.keys(m).map(k => ({ subj: k, avg: mean(m[k]) }));
}

  <div class="grid g4" style="margin-bottom:14px"><div class="stat"><b>${pr.length}</b><span>${esc(t("lv_prio"))}</span></div></div>` +
    listCard("fu_prio", pr) + `<div class="note">${esc(t("rp_disc"))}</div>`;
}

 A01:"التأكد يومياً من وجود الكتب والأدوات المطلوبة في الحقيبة.",

const REPKEY = "marsad_rep_v1";
function repCfg() {
  const d = { school: "مدرسة الرازي للبنين", title: "تقرير متابعة الطالب السلوكي والأكاديمي", year: "2026 - 2027", term: "الفصل الدراسي الأول", principal: "بدرية الظنحاني", counselor: "أحمد سعيد" };
  try { const o = Object.assign({}, d, JSON.parse(localStorage.getItem(REPKEY) || "{}")); if (!o.principal) o.principal = d.principal; if (!o.counselor) o.counselor = d.counselor; return o; } catch (e) { return d; }
}
function saveRepCfg(o) { try { localStorage.setItem(REPKEY, JSON.stringify(o)); } catch (e) {} }
const todayStr = () => { const d = new Date(); return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear(); };
const DOTS = "............................";

function parentAgg(s) {
  const rows = {};
  CODES.forEach(c => {
    const ps = subjAvgs(s, c);
    if (!ps.length) { rows[c] = null; return; }
    const avg = mean(ps.map(x => x.avg));
    rows[c] = { avg: avg, lvl: Math.round(avg), flagged: ps.filter(x => x.avg >= 2.5).map(x => x.subj), n: ps.length };
  });
  return { subs: Array.from(new Set(s.resp.map(r => r.subject))), rows: rows };
}
function parentReport(s, R) {
  const g = parentAgg(s), n = g.subs.length;
  const stmt = c => (ITEMS[c] && ITEMS[c].ar) ? ITEMS[c].ar : c;
  const rowHtml = (c, i) => {
    const r = g.rows[c];
    if (!r) return `<tr><td class="n">${i + 1}</td><td>${esc(stmt(c))}</td><td class="gc" style="text-align:center;color:#777">لم يُرصد</td><td class="sb">—</td></tr>`;
    const cells = `<td class="gc">${gdot(r.avg)}</td>`;
    const sb = !r.flagged.length ? "—" : (r.flagged.length <= 2 ? r.flagged.join("، ") : r.flagged.length + " مواد");
    return `<tr><td class="n">${i + 1}</td><td>${esc(stmt(c))}</td>${cells}<td class="sb">${esc(sb)}</td></tr>`;
  };
  const thead = `<thead><tr><th>#</th><th>العبارة</th><th class="gc">${glLabels()}</th><th>ظهر في</th></tr></thead>`;
  const flaggedItems = CODES.filter(c => g.rows[c] && (g.rows[c].lvl >= 3 || g.rows[c].flagged.length >= 2)).sort((a, b) => g.rows[b].avg - g.rows[a].avg);
  const recs = flaggedItems.slice(0, 6).map(c => PREC[c]);
  const lvNote = [
    "تشير ملاحظات المعلمين إلى سلوك وأداء مستقرين، ولا توجد ملاحظات تستدعي إجراءً خاصاً، ونشكركم على دعمكم ونأمل مواصلة التعزيز الإيجابي.",
    "تشير ملاحظات المعلمين إلى بعض الجوانب التي يمكن تحسينها بالتعاون بين البيت والمدرسة، وهي موضحة في هذا التقرير.",
    "تشير ملاحظات المعلمين إلى عدة جوانب نرى أن دعمها بالتعاون بين البيت والمدرسة سيكون مفيداً لابنكم، وهي موضحة في هذا التقرير.",
    "تشير ملاحظات المعلمين إلى جوانب نرى أهمية التعاون معكم في دعمها في أقرب وقت، وهي موضحة في هذا التقرير."
  ][s.level];
  const follow = s.level >= 2
    ? `نأمل التكرم بالتواصل مع المرشد الأكاديمي${R.counselor ? " (" + esc(R.counselor) + ")" : ""} خلال أسبوع من استلام هذا التقرير لتحديد موعد لقاء ووضع خطة دعم مشتركة لمصلحة ابنكم.`
    : `لا حاجة إلى إجراء خاص في الوقت الحالي، ويسعدنا تواصلكم مع المرشد الأكاديمي في أي وقت للاستفسار أو لمشاركتنا أي ملاحظات.`;
  const hdr = `<header class="rh"><div class="rh-top"><div class="rh-school">${esc(R.school)}</div><div class="rh-title">${esc(R.title)}<small>العام الدراسي ${esc(R.year)} — ${esc(R.term)}</small></div><div class="rh-date">التاريخ: ${todayStr()}</div></div>
    <div class="rh-sign"><span>مديرة المدرسة: <b>${esc(R.principal) || DOTS}</b></span><span>المرشد الأكاديمي: <b>${esc(R.counselor) || DOTS}</b></span></div></header>`;
  const foot = pg => `<div class="rfoot"><span>وثيقة خاصة بولي الأمر — مبنية على ملاحظات المعلمين الصفية</span><span>رقم الطالب: ${esc(s.id || "—")} &nbsp;|&nbsp; صفحة ${pg} من 2</span></div>`;
  const page1 = `<section class="page">${hdr}
    <div class="ri"><div><small>اسم الطالب</small><b>${esc(s.name)}</b></div><div><small>رقم الطالب</small><b>${esc(s.id || "—")}</b></div><div><small>الصف</small><b>${esc(s.grade)}</b></div><div><small>الشعبة</small><b>${esc(s.section)}</b></div></div>
    <p class="rpara" style="margin-top:7px"><b>الفاضل / الفاضلة ولي أمر الطالب ${esc(s.name)} المحترم،</b></p>
    <p class="rpara">تحية طيبة وبعد،</p>
    <p class="rpara">تحرص ${esc(R.school)} على التعاون الوثيق مع أولياء الأمور لدعم أبنائنا سلوكياً وأكاديمياً. ويسرّنا أن نضع بين أيديكم ملخصاً لملاحظات معلمي ابنكم في <b>${n}</b> ${n === 1 ? "مادة دراسية" : n <= 10 ? "مواد دراسية" : "مادة دراسية"} خلال الفترة الماضية، مبنياً على متابعتهم الصفية. ${lvNote}</p>
    <div class="rs">أولاً: الجانب السلوكي</div>
    <table class="rt">${thead}<tbody>${BEH.map(rowHtml).join("")}</tbody></table>
    <div class="rl">النقطة تمثل متوسط ما رصده المعلمون في جميع المواد: كلما اقتربت من اللون الأخضر كان الأمر أقل ظهوراً، وكلما اقتربت من الأحمر كان أكثر ظهوراً. عمود «ظهر في» يبيّن المواد التي ظهر فيها بدرجة مرتفعة.</div>
    <div style="flex:1"></div>${foot(1)}</section>`;
  const page2 = `<section class="page"><div class="rh2"><b>${esc(R.school)}</b><span>${esc(R.title)} — الطالب: <b>${esc(s.name)}</b></span></div>
    <div class="rs" style="margin-top:2px">ثانياً: الجانب الأكاديمي</div>
    <table class="rt">${thead}<tbody>${ACA.map(rowHtml).join("")}</tbody></table>
    <div class="rs">ثالثاً: توصيات للتعاون بين البيت والمدرسة</div>
    ${recs.length ? `<ul class="rul">${recs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="rpara">نوصي بمواصلة تشجيع ابنكم والثناء على التزامه، والمتابعة الدورية لواجباته وحضوره.</p>`}
    <div class="rs">رابعاً: متابعة المدرسة</div>
    <p class="rpara">${follow}</p>
    <p class="rpara" style="font-size:8.4pt;color:#444">ملاحظة: هذا التقرير مبني على ملاحظات المعلمين الصفية، وهو لا يمثل تشخيصاً نفسياً أو طبياً ولا يُعدّ حكماً على الطالب.</p>
    <p class="rpara">شاكرين لكم حسن تعاونكم،،،</p>
    <div class="rsig"><div>المرشد الأكاديمي<br><b>${esc(R.counselor) || DOTS}</b></div><div>مديرة المدرسة<br><b>${esc(R.principal) || DOTS}</b></div><div>اطلعتُ على التقرير — ولي الأمر<br>الاسم: ${DOTS}<br>التاريخ: ........../........../..........</div></div>
    ${foot(2)}</section>`;
  return page1 + page2;
}
let PR = { mode: "one", cls: "" };
function vParent() {
  if (!A.recs.length) return empty();
  const S = Array.from(A.students.values()).sort((a, b) => sName(a).localeCompare(sName(b), "ar"));
  if (!CUR || !A.students.get(CUR)) CUR = S[0].key;
  const R = repCfg();
  const clsKeys = Object.keys(A.classes).sort((a, b) => { const x = a.split("/").map(Number), y = b.split("/").map(Number); return x[0] - y[0] || x[1] - y[1]; });
  if (!PR.cls || !A.classes[PR.cls]) PR.cls = clsKeys[0];
  const inp = (k, lab) => `<div><label>${esc(t(lab))}</label><input data-rcfg="${k}" value="${esc(R[k])}"></div>`;
  const targets = PR.mode === "one" ? [A.students.get(CUR)] : A.classes[PR.cls].stu.slice().sort((a, b) => sName(a).localeCompare(sName(b), "ar"));
  return `<h2 class="pt no-print">${esc(t("pr_t"))}</h2><p class="ps no-print">${esc(t("pr_s"))}</p>
  <div class="card no-print"><div class="rcfg">${inp("school", "pr_school")}${inp("principal", "pr_principal")}${inp("counselor", "pr_counselor")}${inp("year", "pr_year")}${inp("term", "pr_term")}${inp("title", "pr_title")}</div>
    <p class="hint">${esc(t("pr_hint"))}</p><label class="chk"><input type="checkbox" data-excl ${EXCL ? "checked" : ""}> ${esc(t("ex_lbl"))}</label>
    <div class="seg"><button data-prmode="one" class="${PR.mode === "one" ? "on" : ""}">${esc(t("pr_one"))}</button><button data-prmode="class" class="${PR.mode === "class" ? "on" : ""}">${esc(t("pr_class"))}</button></div>
    <div class="tb">${PR.mode === "one" ? `<select id="pickPR">${S.map(x => `<option value="${SK.indexOf(x.key)}" ${x.key === CUR ? "selected" : ""}>${esc(sName(x))} (${esc(clsName(x.grade, x.section))})</option>`).join("")}</select>`
      : `<select id="pickPRC">${clsKeys.map(k => `<option ${k === PR.cls ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>`}
      <button class="btn" id="btnPrintRep">${esc(t("pr_print"))} (${targets.length})</button></div></div>
  <div class="rwrap" id="reports" dir="rtl">${targets.map(x => parentReport(x, R)).join("")}</div>`;
}

const VIEWS = { overview: ["📊", vOverview], classes: ["🏫", vClasses], students: ["👥", vStudents], student: ["🧾", vStudent], parent: ["🖨️", vParent], import: ["📂", vImport] };

function render() {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.title = t("title") + " | MARSAD";
  $("#bTitle").textContent = t("title"); $("#bDesc").textContent = t("desc"); $("#bSchool").textContent = CFG.SCHOOL[LANG === "ar" ? 0 : 1];
  $("#langBtn").textContent = t("lang");
  const has = A && A.recs.length;
  $("#nav").innerHTML = Object.keys(VIEWS).map(k => `<button data-view="${k}" class="${VIEW === k ? "on" : ""}" ${(!has && k !== "import") ? "disabled" : ""}><span class="ic">${VIEWS[k][0]}</span>${esc(t("v_" + k))}</button>`).join("");
  $("#main").innerHTML = VIEWS[VIEW][1]();
  bindView();
}
function go(v) { VIEW = v; render(); window.scrollTo({ top: 0 }); }

function bindView() {
  if (VIEW === "import") {
    const dir = $("#inDir"), fl = $("#inFiles"), drop = $("#drop");
    $("#btnDir").onclick = () => dir.click(); $("#btnFiles").onclick = () => fl.click();
    dir.onchange = () => { handleFiles(dir.files); dir.value = ""; }; fl.onchange = () => { handleFiles(fl.files); fl.value = ""; };
    ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", async e => { handleFiles(await filesFromDrop(e.dataTransfer)); });
    $("#btnRoster").onclick = () => $("#inRoster").click();
    $("#inRoster").onchange = e => { if (e.target.files[0]) loadRosterFile(e.target.files[0]); };
    const cl = $("#btnClear");
    if (cl) cl.onclick = () => { if (confirm(t("clear_q"))) { STORE = {}; LASTIMP = null; CUR = null; analyze(); persist(); render(); } };
  }
  if (VIEW === "parent") {
    const p1 = $("#pickPR"); if (p1) p1.onchange = () => { CUR = SK[Number(p1.value)]; render(); };
    const p2 = $("#pickPRC"); if (p2) p2.onchange = () => { PR.cls = p2.value; render(); };
    $("#btnPrintRep").onclick = () => window.print();
  }
  if (VIEW === "student") {
    const p = $("#pickStu"); if (p) p.onchange = () => { CUR = p.value === "" ? null : SK[Number(p.value)]; render(); };
    const pr = $("#btnPrint"); if (pr) pr.onclick = () => window.print();
  }
}

/* أحداث عامة بالتفويض */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-coll],[data-cscope],[data-cgrp],[data-rmode],[data-prmode],[data-view],[data-sort],[data-more],[data-student],[data-item],[data-class],[data-csv],[data-gradefilter],[data-clearitem],#md-close");
  if (!el) return;
  if (el.id === "md-close") { closeModal(); return; }
  if (el.dataset.coll) { const k = el.dataset.coll, box = el.closest(".cl"); COLL[k] = !COLL[k]; box.classList.toggle("closed", !!COLL[k]); return; }
  if (el.dataset.cscope) { CMPSCOPE = el.dataset.cscope; computeCompletion(); render(); return; }
  if (el.dataset.cgrp) { CMPGRP = el.dataset.cgrp; computeCompletion(); render(); return; }
  if (el.dataset.rmode !== undefined) { REPMODE = el.dataset.rmode; render(); return; }
  if (el.dataset.prmode) { PR.mode = el.dataset.prmode; render(); return; }
  if (el.dataset.clearitem !== undefined) { e.preventDefault(); F.item = ""; render(); return; }
  if (el.dataset.view) { go(el.dataset.view); return; }
  if (el.dataset.sort) { const [id, i] = el.dataset.sort.split(":"), st = TBL[id], n = Number(i); if (st.sort === n) st.dir *= -1; else { st.sort = n; st.dir = 1; } $("#tb-" + id).innerHTML = tblInner(id); return; }
  if (el.dataset.more) { TBL[el.dataset.more].limit += CFG.PAGE; $("#tb-" + el.dataset.more).innerHTML = tblInner(el.dataset.more); return; }
  if (el.dataset.csv) { toCSV(el.dataset.csv); return; }
  if (el.dataset.student !== undefined) { CUR = SK[Number(el.dataset.student)]; closeModal(); go("student"); return; }
  if (el.dataset.class) { const [g, s] = el.dataset.class.split("/"); F = { grade: g, section: s, level: "", subject: "", item: "", q: "" }; go("students"); return; }
  if (el.dataset.gradefilter) { F = { grade: el.dataset.gradefilter, section: "", level: "", subject: "", item: "", q: "" }; go("students"); return; }
  if (el.dataset.item) openItem(el.dataset.item);
});
document.addEventListener("input", e => { const id = e.target.dataset && e.target.dataset.tsearch; if (id) { TBL[id].q = e.target.value; TBL[id].limit = CFG.PAGE; $("#tb-" + id).innerHTML = tblInner(id); } });
document.addEventListener("change", e => {
  const d0 = e.target.dataset || {};
  if (d0.cmerge !== undefined) { CMPMERGE = e.target.checked; computeCompletion(); render(); return; }
  if (d0.rmerge !== undefined) { REPMERGE = e.target.checked; render(); return; }
  if (d0.excl !== undefined) { EXCL = e.target.checked; render(); return; } const rk = e.target.dataset && e.target.dataset.rcfg; if (rk) { const R0 = repCfg(); R0[rk] = e.target.value; saveRepCfg(R0); render(); return; }
  const f = e.target.dataset && e.target.dataset.f; if (f) { F[f] = e.target.value; render(); } });
function fitStudentPrint() {
  const el = document.getElementById("srep"); if (!el || VIEW !== "student") return;
  el.classList.add("pfit"); el.style.zoom = "";
  const maxH = 297 * 96 / 25.4 - 6, h = el.scrollHeight;
  if (h > maxH) el.style.zoom = (maxH / h).toFixed(3);
}
function unfitStudentPrint() { const el = document.getElementById("srep"); if (el) { el.classList.remove("pfit"); el.style.zoom = ""; } }
window.addEventListener("beforeprint", fitStudentPrint); window.addEventListener("afterprint", unfitStudentPrint);
$("#langBtn").onclick = () => { LANG = LANG === "ar" ? "en" : "ar"; Object.keys(TBL).forEach(k => delete TBL[k]); render(); };

function openItem(c) {
  const list = Array.from(A.students.values()).filter(s => s.flagged.includes(c)).sort((a, b) => b.entries[c].length - a.entries[c].length);
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="box"><h3>${esc(t("md_t"))}</h3><p><b>${esc(itemTxt(c))}</b></p>${legend()}<div class="tw"><table class="t"><tbody>` +
    list.map(s => { const by = s.entries[c].filter(e => e.level >= CFG.FLAG_LEVEL); return `<tr data-student="${SK.indexOf(s.key)}"><td>${esc(sName(s))}</td><td>${esc(clsName(s.grade, s.section))}</td><td>${by.map(e => `<span class="pill">${esc(e.teacher)} – ${esc(lvlTxt(e.level))}</span>`).join("")}</td></tr>`; }).join("") +
    `</tbody></table></div><p style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="md-filter">${esc(t("v_students"))} (${list.length})</button><button class="btn ghost" id="md-close">${esc(t("close"))}</button></p></div>`;
  document.body.appendChild(m);
  m.addEventListener("click", ev => { if (ev.target === m) closeModal(); });
  $("#md-filter").onclick = () => { F = { grade: "", section: "", level: "", subject: "", item: c, q: "" }; closeModal(); go("students"); };
}
function closeModal() { const m = $("#modal"); if (m) m.remove(); }

/* التشغيل */
(async function init() {
  if (window.PQ_CLASSES && window.PQ_SUBJECTS) setRoster(window.PQ_CLASSES, window.PQ_SUBJECTS);
  else { const r0 = await idbGet("roster"); if (r0 && r0.classes) setRoster(r0.classes, r0.subjects); }
  const saved = await idbGet("store");
  if (saved && saved.records) { STORE = saved.records; Object.assign(ITEMS, saved.items || {}); }
  analyze();
  VIEW = A.recs.length ? "overview" : "import";
  render();
})();
</script>
