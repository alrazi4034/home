<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِرْصاد | إدخال ملاحظات المعلمين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- ملف البيانات الخارجي: ضعه في نفس مجلد هذا الملف -->
<script src="student_teachers_data.js"></script>
<style>
:root{
  --bg:#F2F2F0; --panel:#FFFFFF; --ink:#1A1A1A; --soft:#6B6B6B; --line:#DDDDDA;
  --primary:#2563EB; --primary-soft:#E8EEFC; --clay:#C9A227;
  --green:#2F6B4F; --green-soft:#E1EFE7; --amber:#8A6A1E; --amber-soft:#FBF3D9;
  --berry:#7A2E2E; --berry-soft:#F2E4E2; --slate:#7C8896; --slate-soft:#EDF0F4; --danger:#DC2626;
  --l0:#E1EFE7; --l0f:#2F6B4F; --l1:#EDF0F4; --l1f:#4a5663; --l2:#FBF3D9; --l2f:#8A6A1E; --l3:#F5DFC4; --l3f:#8A4B12; --l4:#F2E4E2; --l4f:#7A2E2E;
  --s0:#2F6B4F; --s1:#7C8896; --s2:#C9A227; --s3:#C0702A; --s4:#7A2E2E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.65;font-size:14.5px}
button,select,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
header.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 0}
.topbar-inner{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand-logo{height:56px;width:auto;cursor:pointer}
.brand-text{flex:1 1 260px}
.brand-text h1{font-family:'El Messiri',sans-serif;font-weight:700;font-size:19px;margin:0}
.brand-text p{margin:0;font-size:13px;color:var(--soft)}
.brand-text .sub{color:var(--primary);font-weight:700;font-size:14px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;border-radius:0;text-decoration:none;transition:.12s}
.btn:hover{border-color:var(--primary);background:var(--primary-soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;border-bottom:2px solid var(--clay)}
.btn.primary:hover{background:#3B74F0}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.wrap{max-width:1500px;margin:0 auto;padding:16px 20px 90px}
.card{background:var(--panel);border:1px solid var(--line);padding:18px 20px;margin-bottom:14px}
.card h2{font-family:'El Messiri',sans-serif;font-size:18px;margin:0 0 4px}
.sub{color:var(--soft);margin:0 0 12px;font-size:13.5px}
label.fl{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-bottom:4px}
select,input[type=text],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:0}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:10px}
.modebtn{border:1px solid var(--line);background:var(--panel);padding:18px;text-align:start;cursor:pointer;border-radius:0;transition:.12s}
.modebtn:hover{border-color:var(--primary);background:var(--primary-soft)}
.modebtn .ic{font-size:28px;display:block}
.modebtn b{font-family:'El Messiri',sans-serif;font-size:17px;display:block}
.modebtn span.d{color:var(--soft);font-size:13px}
.modebtn[disabled]{opacity:.4;pointer-events:none}
.note{background:var(--amber-soft);border:1px solid #E7D7A3;color:var(--amber);padding:8px 12px;font-size:13px;margin:10px 0}
.note.info{background:var(--primary-soft);border-color:#C8D6F7;color:#1D4FBF}

/* شريط السياق والتقدم */
.ctx{background:var(--panel);border:1px solid var(--line);margin-bottom:12px;position:sticky;top:0;z-index:30}
.ctx-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px}
.chip{display:inline-flex;gap:5px;align-items:center;padding:3px 10px;border:1px solid var(--line);background:var(--bg);font-size:12.5px}
.chip b{color:var(--primary)}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{border:0;background:var(--panel);padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--primary);color:#fff}
.spacer{flex:1}
.prog{height:22px;background:var(--slate-soft);position:relative;border-top:1px solid var(--line)}
.prog i{display:block;height:100%;background:#52B183;transition:width .25s}
.prog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#111;text-shadow:0 0 3px #fff}

/* فردي */
.sbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dd{position:relative;flex:1 1 280px;min-width:240px}
.dd-btn{width:100%;text-align:start;display:flex;gap:8px;align-items:center;padding:9px 12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700}
.dd-btn .arr{margin-inline-start:auto;color:var(--soft)}
.dd-list{position:absolute;inset-inline:0;top:100%;background:var(--panel);border:1px solid var(--primary);max-height:60vh;overflow:auto;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.ddi{display:flex;gap:8px;align-items:center;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);padding:8px 12px;background:var(--panel);cursor:pointer}
.ddi:hover{filter:brightness(.96)}
.ddi small{margin-inline-start:auto;color:var(--soft);font-size:11.5px}
.ddi.cur{outline:2px solid var(--primary);outline-offset:-2px}
.ddi.st-done,.dd-btn.st-done{background:var(--green-soft)}
.ddi.st-partial,.dd-btn.st-partial{background:var(--amber-soft)}
.ddi.st-na,.dd-btn.st-na{background:var(--slate-soft)}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--slate);flex:0 0 auto}
.st-done .dot{background:var(--green);border-color:var(--green)}
.st-partial .dot{background:var(--clay);border-color:var(--clay)}
.st-na .dot{background:var(--slate);border-color:var(--slate)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--soft);padding:6px 12px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0}
.legend span{display:inline-flex;gap:5px;align-items:center}
.stuhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.stuhead h2{margin:0}
.badge{padding:2px 10px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--bg)}
.badge.done{background:var(--green-soft);color:var(--green);border-color:#B9D8C7}
.badge.partial{background:var(--amber-soft);color:var(--amber);border-color:#E7D7A3}
.badge.na{background:var(--slate-soft);color:#4a5663}
.qf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--primary-soft);border:1px solid #C8D6F7;padding:8px 12px;margin-bottom:12px}
.qf b{font-size:13px;color:#1D4FBF}
.qbtn{border:1px solid var(--line);background:#fff;padding:4px 11px;cursor:pointer;font-size:12.5px;font-weight:600}
.qbtn:hover{border-color:var(--primary)}
.qbtn.l0{background:var(--l0);color:var(--l0f)}.qbtn.l1{background:var(--l1);color:var(--l1f)}.qbtn.l2{background:var(--l2);color:var(--l2f)}.qbtn.l3{background:var(--l3);color:var(--l3f)}.qbtn.l4{background:var(--l4);color:var(--l4f)}
.sec{font-family:'El Messiri',sans-serif;font-weight:700;font-size:16px;color:var(--primary);margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--clay);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line)}
.row:nth-child(even){background:#FAFAF8}
.row .st{font-size:14px}.row .st small{color:var(--soft);display:block}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:#fff;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;min-width:64px}
.opt:hover{border-color:var(--primary)}
.opt.l0.on{background:var(--s0);color:#fff;border-color:var(--s0)}.opt.l1.on{background:var(--s1);color:#fff;border-color:var(--s1)}.opt.l2.on{background:var(--s2);color:#fff;border-color:var(--s2)}.opt.l3.on{background:var(--s3);color:#fff;border-color:var(--s3)}.opt.l4.on{background:var(--s4);color:#fff;border-color:var(--s4)}
.opt.f.on{background:var(--primary);color:#fff;border-color:var(--primary)}
textarea{min-height:64px;resize:vertical}
.dock{position:fixed;inset-inline:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:10px;justify-content:center;align-items:center;z-index:35;flex-wrap:wrap}
.dock .info{color:var(--soft);font-size:13px}

/* جماعي */
.gridtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.gridwrap{background:var(--panel);border:1px solid var(--line);overflow:auto}
table.gt{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.gt th,.gt td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:0;text-align:center;background:var(--panel)}
.gt thead th{position:sticky;z-index:5;height:34px;font-weight:700;padding:2px 4px;white-space:nowrap}
.gt thead tr.grp th{top:0;background:#fafaf8}
.gt thead tr.cols th{top:34px;background:#fff;font-size:11.5px;vertical-align:bottom}
.gt th.gh{cursor:pointer;color:var(--primary);user-select:none;font-family:'El Messiri',sans-serif;font-size:13px}
.gt th.gh:hover{background:var(--primary-soft)}
.gt th.gh.collapsed{background:var(--clay);color:#fff}
.gt .stk{position:static}
.gt th.stk{z-index:9}
.gt .name{text-align:start;padding:3px 8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.gt .tools{padding:2px 2px;border-inline-end:2px solid var(--line)}
.gt tr.st-done td.name,.gt tr.st-done td.tools{background:var(--green-soft)}
.gt tr.st-partial td.name,.gt tr.st-partial td.tools{background:var(--amber-soft)}
.gt tr.st-na td{background:var(--slate-soft)}
.gt tr.st-na td.c button{opacity:.35;pointer-events:none}
.gt .name small{display:block;color:var(--soft);font-weight:400;font-size:11px}
.cell{width:100%;min-width:0;height:28px;border:0;background:transparent;cursor:pointer;font-weight:700;font-size:13px}
.cell:hover{outline:2px solid var(--primary);outline-offset:-2px}
.cell.l0{background:var(--l0);color:var(--l0f)}.cell.l1{background:var(--l1);color:var(--l1f)}.cell.l2{background:var(--l2);color:var(--l2f)}.cell.l3{background:var(--l3);color:var(--l3f)}.cell.l4{background:var(--l4);color:var(--l4f)}
.cell.f{font-size:11px}.cell.w{font-size:12px}.cell.fy{background:var(--primary-soft);color:#1D4FBF}.cell.fn{background:var(--l0);color:var(--l0f)}.cell.fp{background:var(--l2);color:var(--l2f)}
.gt td.sumc{min-width:74px;font-weight:700;font-size:12px}
.gt td.sumc.full{background:var(--green-soft);color:var(--green)}.gt td.sumc.part{background:var(--amber-soft);color:var(--amber)}
.gt td.tx input{width:170px;border:0;padding:6px 8px;font-size:12.5px;background:transparent}
.gt th select{width:auto;padding:1px 2px;font-size:11px;border:1px solid var(--line);max-width:46px}

.gt th.wide{padding:0;vertical-align:bottom}
.gt .rot{height:170px;display:flex;align-items:flex-end;justify-content:center}
.gt .rot span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-size:11px;font-weight:500;max-height:166px;overflow:hidden;text-overflow:ellipsis;padding:3px 0}
.gt .fh{font-size:10.5px;white-space:normal;line-height:1.15}
.gt{table-layout:fixed;width:calc(100% - 2px);min-width:900px;border-collapse:collapse}
.gt col.cname{width:250px}.gt col.ctools{width:108px}.gt col.csum{width:58px}.gt col.cf{width:70px}
.gt td.c{padding:0}
@media(min-width:940px){.gridwrap{overflow-x:hidden}}
.gt .cell.l0{background:#B7DCC6}.gt .cell.l2{background:#F3D98B}.gt .cell.l4{background:#E7978E}
.gt .cell:not(.l0):not(.l2):not(.l4):not(.f){background:#fff}
.gt .cell.f.fy{background:#CFE0FB}
.gridtools .lgd{display:inline-flex;gap:12px;font-size:12.5px;color:var(--soft)}.gridtools .lgd span{display:inline-flex;gap:5px;align-items:center}
.gridtools .lgd .cell{display:inline-block;width:18px;height:14px;min-width:0;border:1px solid var(--line);cursor:default}
.gridtools .lgd .cell.l0{background:#B7DCC6}.gridtools .lgd .cell.l2{background:#F3D98B}.gridtools .lgd .cell.l4{background:#E7978E}
.tl{display:flex;gap:3px;justify-content:center;align-items:center}
.tl button{border:1px solid var(--line);background:#fff;cursor:pointer;padding:2px 6px;font-size:12px}
.tl button:hover{border-color:var(--primary);background:var(--primary-soft)}
.tl .cnt{font-size:11px;color:var(--soft);min-width:34px}
#qfpop{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--primary);box-shadow:0 8px 24px rgba(0,0,0,.2);padding:8px;display:none}
#qfpop b{display:block;font-size:12px;margin-bottom:6px}
#qfpop .qbtn{display:block;width:100%;margin-bottom:4px;text-align:start}
.toast{position:fixed;inset-inline:0;bottom:70px;margin:0 auto;width:max-content;max-width:92vw;background:#1A1A1A;color:#fff;padding:9px 18px;z-index:90;font-size:13px;display:flex;gap:12px;align-items:center}
.toast button{background:var(--clay);border:0;padding:3px 10px;cursor:pointer;font-weight:700}
@media(max-width:760px){.row{grid-template-columns:1fr}.wrap{padding:12px 10px 90px}}
@media print{.dock,.ctx,header,.gridtools{display:none}}
</style>
</head>

const DB = { grades: {}, teachers: {}, ready: false };
function parseStudent(raw) {
  const m = String(raw).match(/^(.*?)\s*\(([^()]*)\)\s*$/);
  return { raw: String(raw), name: (m ? m[1] : raw).replace(/\s+/g, " ").trim(), id: m ? m[2].trim() : "" };
}
function buildDB(classes, subjects) {
  DB.grades = {}; DB.teachers = {};
  Object.keys(classes).forEach(key => {
    const p = key.split("-"), g = p[0], s = p[1]; if (!g || !s) return;
    (DB.grades[g] = DB.grades[g] || {})[s] = (classes[key] || []).map(parseStudent);
  });
  Object.keys(subjects).forEach(subj => (subjects[subj] || []).forEach(t => {
    DB.teachers[t] = DB.teachers[t] || []; if (DB.teachers[t].indexOf(subj) < 0) DB.teachers[t].push(subj);
  }));
  DB.ready = true;
}

let saveT = null;
function flush() {

  if (ctxReady() && S.loadedKey === ctxKey()) safeSet(ctxKey(), { rows: S.rows, cur: S.cur, mode: S.mode, col: S.col, exportedAt: S.exportedAt });
  safeSet(LAST_KEY, { lang: S.lang, teacher: S.teacher, subject: S.subject, grade: S.grade, section: S.section });
}
function save(now) { clearTimeout(saveT); if (now) flush(); else saveT = setTimeout(flush, 250); }
function loadCtx() {
  S.rows = {}; S.cur = 0; S.exportedAt = 0; S.loadedKey = ctxReady() ? ctxKey() : "";
  const d = ctxReady() ? safeGet(ctxKey()) : null;
  if (d && d.rows) { S.rows = d.rows; S.cur = d.cur || 0; S.exportedAt = d.exportedAt || 0; if (d.col) S.col = Object.assign(S.col, d.col); return Object.keys(d.rows).length > 0; }

function filled(r) { return ITEMS.filter(i => r.a[i.code]).length + FOLLOWUP.filter(f => r.f[f.field]).length; }
function statusOf(st) {
  const r = S.rows[skey(st)]; if (!r) return "empty";
  if (r.na) return "na";
  const n = filled(r); return n >= TOTAL ? "done" : n > 0 ? "partial" : "empty";
}
function counts() {
  const c = { done: 0, partial: 0, na: 0, empty: 0 };
  roster().forEach(st => c[statusOf(st)]++);
  c.all = roster().length; c.total = c.all - c.na;   // من لم يلحظهم المعلم لا يُحتسبون
  c.finished = c.done; c.pct = c.total ? Math.round(c.finished / c.total * 100) : (c.all ? 100 : 0);

function rowHTML(st, idx) {
  const k = skey(st), r = rowOf0(st), s = statusOf(st);
  let h = '<tr class="st-' + s + '" data-k="' + esc(k) + '"><td class="name stk" data-nm="1" title="' + esc(st.name) + ' — #' + esc(st.id || "—") + '">' + (idx + 1) + ". " + esc(st.name) + '</td><td class="tools stk"><div class="tl"><button data-qfo="' + esc(k) + '" title="' + esc(t("fillRow")) + '" type="button">⚡</button><button data-nak="' + esc(k) + '" title="' + esc(t("markNA")) + '" type="button">🚫</button><span class="cnt">' + (r.na ? "—" : filled(r) + "/" + TOTAL) + "</span></div></td>";
  GROUPS.forEach(g => {
    if (S.col[g.id]) { h += sumCell(g, r); return; }
    if (g.id === "F") h += FOLLOWUP.map(f => '<td class="c">' + cellHTML(f.code, r, f) + "</td>").join("");
    else h += g.items.map(i => '<td class="c">' + cellHTML(i.code, r) + "</td>").join("");
  });
  return h + "</tr>";
}
function renderGrid() {
  const R = roster();
  const g1 = GROUPS.map(g => {
    const n = g.items.length, col = S.col[g.id];
    return '<th class="gh' + (col ? " collapsed" : "") + '" data-tog="' + g.id + '" colspan="' + (col ? 1 : n) + '" title="' + esc(t(g.label)) + '">' + (col ? (S.lang === "ar" ? "◂ " : "▸ ") : "▾ ") + esc(t(g.label)) + " <small>(" + n + ")</small></th>";
  }).join("");
  const lab = (txt, n) => S.wide ? '<div class="rot"><span>' + esc(txt) + "</span></div>" : n;
  const g2 = GROUPS.map(g => {
    if (S.col[g.id]) return '<th class="sumh"></th>';
    if (g.id === "F") return FOLLOWUP.map(f => '<th class="fh' + (S.wide ? " wide" : "") + '" title="' + esc(itemText(f)) + '">' + (S.wide ? lab(itemText(f)) : esc(f.short[S.lang === "ar" ? 0 : 1])) + "</th>").join("");
    return g.items.map((i, n) => '<th class="' + (S.wide ? "wide" : "") + '" title="' + esc(itemText(i)) + '">' + lab(itemText(i), n + 1) + "</th>").join("");
  }).join("");
  const cg = '<colgroup><col class="cname"><col class="ctools">' + GROUPS.map(g => S.col[g.id] ? '<col class="csum">' : g.id === "F" ? FOLLOWUP.map(() => '<col class="cf">').join("") : g.items.map(() => "<col>").join("")).join("") + "</colgroup>";
  const lg = '<span class="lgd">' + SCALE.map(sc => '<span><i class="cell l' + sc.level + '"></i>' + esc(S.lang === "ar" ? sc.ar : sc.en) + "</span>").join("") + '<span><i class="cell"></i>' + esc(t("empty")) + "</span></span>";
  $("#body").innerHTML = '<div class="gridtools"><button class="btn sm" data-act="expandall" type="button">' + esc(t("expandAll")) + '</button><button class="btn sm" data-act="collapseall" type="button">' + esc(t("collapseAll")) + '</button><label style="display:inline-flex;gap:5px;align-items:center;font-size:13px;cursor:pointer"><input type="checkbox" data-act="wide"' + (S.wide ? " checked" : "") + "> " + esc(t("showText")) + '</label><span class="spacer"></span>' + lg + "</div>" +
    '<div class="note info" style="margin-top:0">' + esc(t("gridHint")) + "</div>" +
    '<div class="gridwrap"><table class="gt">' + cg + '<thead><tr class="grp"><th class="stk name" rowspan="2">' + esc(t("student")) + '</th><th class="stk tools" rowspan="2">' + esc(t("tools")) + "</th>" + g1 + '</tr><tr class="cols">' + g2 + "</tr></thead><tbody>" + R.map(rowHTML).join("") + "</tbody></table></div>";
  // موضع صف العناوين الثاني تحت الأول
  const h1 = document.querySelector(".gt thead tr.grp th.gh"); if (h1) document.querySelectorAll(".gt thead tr.cols th").forEach(th => th.style.top = h1.offsetHeight + "px");
}
function refreshRowDOM(k) {
  const st = roster().find(x => skey(x) === k); if (!st) return;
  const tr = document.querySelector('tr[data-k="' + CSS.escape(k) + '"]'); if (!tr) return;
  const idx = roster().indexOf(st), tmp = document.createElement("tbody"); tmp.innerHTML = rowHTML(st, idx);
  const act = document.activeElement, pos = act && tr.contains(act) ? { c: act.dataset.ca || act.dataset.cf } : null;
  tr.replaceWith(tmp.firstChild);
  if (pos && pos.c) { const nb = document.querySelector('tr[data-k="' + CSS.escape(k) + '"] [data-ca="' + pos.c + '"],tr[data-k="' + CSS.escape(k) + '"] [data-cf="' + pos.c + '"]'); if (nb) nb.focus(); }
  updateProgress();
}

/* =====================================================================
   تعديل القيم | MUTATIONS
   ===================================================================== */
const touch = r => { r.at = Date.now(); };
function setAns(st, code, key) { const r = rowOf(st); if (key) r.a[code] = key; else delete r.a[code]; r.na = false; touch(r); save(); }
function setFu(st, field, v) { const r = rowOf(st); if (v) r.f[field] = v; else delete r.f[field]; r.na = false; touch(r); save(); }
function quickFill(st, level) {
  const r = rowOf(st), before = JSON.stringify(r); const key = SCALE[level].key;
  ITEMS.forEach(i => r.a[i.code] = key); r.na = false; touch(r); save();
  return () => { S.rows[skey(st)] = JSON.parse(before); save(); S.mode === "single" ? renderSingle() : refreshRowDOM(skey(st)); updateProgress(); };
}
function toggleNA(st) { const r = rowOf(st); r.na = !r.na; touch(r); save(); }
function cycle(cur, list, back) {   // empty → list[0] → … → empty
  const seq = [""].concat(list); let i = seq.indexOf(cur || ""); i = (i + (back ? -1 : 1) + seq.length) % seq.length; return seq[i];
}

/* =====================================================================
   التصدير والاستيراد | EXPORT / IMPORT
   ===================================================================== */
function buildBatch() {
  const R = roster(), statements = {};
  ITEMS.forEach(i => statements[i.code] = { ar: i.ar, en: i.en });
  FOLLOWUP.forEach(f => statements[f.code] = { ar: f.ar, en: f.en, field: f.field });
  const students = [], missing = [];
  R.forEach(st => {
    const s = statusOf(st), r = S.rows[skey(st)];
    if (s === "empty") { missing.push(st.name); return; }
    if (s === "partial") missing.push(st.name);
    const e = { id: st.id, name: st.name, sourceEntry: st.raw, status: s, updatedAt: new Date(r.at || Date.now()).toISOString() };
    if (s !== "na") { e.answers = Object.assign({}, r.a); e.followUp = Object.assign({}, r.f); }
    students.push(e);
  });
  const now = new Date();
  return { missing: missing, batch: {
    schemaVersion: CONFIG.SCHEMA_VERSION, app: CONFIG.APP_NAME, type: "classBatch", batchId: makeId(),
    exportedAt: now.toISOString(), exportedAtLocal: now.toLocaleString("en-GB", { hour12: false }), formLanguage: S.lang,
    teacher: { name: S.teacher }, subject: { name: S.subject, code: subjectCode(S.subject) },
    class: { grade: S.grade, section: S.section, classCode: S.grade + "-" + S.section },
    scale: { note: "answers are observation-frequency choices (never / sometimes / always), not a grade or a diagnosis.", values: SCALE.map(x => ({ key: x.key, level: x.level, labelAr: x.ar, labelEn: x.en })) },
    statements: statements, students: students,
    totals: { roster: R.length, enteredStudents: students.filter(x => x.status === "done").length, notObserved: students.filter(x => x.status === "na").length, incomplete: students.filter(x => x.status === "partial").length, missingNames: missing }
  } };
}
function downloadBatch() {
  const c = counts(); if (c.done + c.partial + c.na === 0) { toast(t("dlNone")); return; }
  const b = buildBatch();
  if (b.missing.length && !confirm(t("dlWarn").replace("{n}", b.missing.length))) return;
  const name = S.grade + S.section + "_" + subjectCode(S.subject) + ".json";
  const blob = new Blob([JSON.stringify(b.batch, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  S.exportedAt = Date.now(); save(); toast(t("dlOk") + name);
}
const readText = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(f, "utf-8"); });
function rowFromAnswers(ans, fu) {
  const r = blankRow(); const a = ans || {};
  const OLD = { never: "never", rarely: "sometimes", sometimes: "sometimes", often: "always", always: "always" };
  ITEMS.forEach(i => { const v = a[i.code]; if (v != null) { let key = typeof v === "object" ? (v.answer != null ? v.answer : v.frequencyLevel) : v; if (typeof key === "number") key = key <= 0 ? "never" : key <= 2 ? "sometimes" : "always"; const k2 = OLD[key]; if (k2) r.a[i.code] = k2; } });
  FOLLOWUP.forEach(f => { let v = fu && fu[f.field]; if (v && typeof v === "object") v = v.answer; if (v && f.opts.some(o => o[0] === v)) r.f[f.field] = v; });
  return r;
}
async function importFiles(files) {
  if (!DB.ready) { toast(t("impNoData")); return; }
  let total = 0, skipped = 0, lastCtx = null, bad = 0;
  const incoming = [];   // {ctx, entries:[{id,name,row}]}
  for (const f of Array.from(files)) {
    try {
      const j = JSON.parse((await readText(f)).replace(/^﻿/, ""));
      if (!j || (j.app && String(j.app).toLowerCase() !== "marsad")) { bad++; continue; }
      if (j.type === "classBatch" && Array.isArray(j.students)) {
        const ctx = { teacher: j.teacher.name, subject: j.subject.name, grade: String(j.class.grade), section: String(j.class.section) };
        incoming.push({ ctx: ctx, entries: j.students.map(s => { const row = s.status === "na" ? Object.assign(blankRow(), { na: true }) : rowFromAnswers(s.answers, s.followUp); row.at = Date.parse(s.updatedAt) || Date.now(); return { id: s.id || "", name: s.name || "", row: row }; }) });
      } else if (j.behavioral && j.student) {   // ملف طالب واحد من الإصدار السابق
        const ans = {}; (j.behavioral || []).concat(j.academic || []).forEach(x => { if (x.code) ans[x.code] = x.answer != null ? x.answer : x.frequencyLevel; });
        const row = rowFromAnswers(ans, j.followUp); row.at = Date.parse(j.submittedAt) || Date.now();
        incoming.push({ ctx: { teacher: j.teacher.name, subject: j.subject.name, grade: String(j.student.grade), section: String(j.student.section) }, entries: [{ id: j.student.id || "", name: j.student.name || "", row: row }] });
      } else bad++;
    } catch (e) { bad++; }
  }
  if (!incoming.length) { toast(t("impBad")); return; }
  // دمج حسب السياق (معلم/مادة/شعبة)
  const groups = {};
  incoming.forEach(x => { const k = [x.ctx.teacher, x.ctx.subject, x.ctx.grade, x.ctx.section].join("|"); (groups[k] = groups[k] || { ctx: x.ctx, entries: [] }).entries.push(...x.entries); });
  const cur = ctxReady() ? { teacher: S.teacher, subject: S.subject, grade: S.grade, section: S.section } : null;
  if (cur && S.mode) save(true);
  Object.keys(groups).forEach(k => {
    const g = groups[k], ctx = g.ctx;
    S.teacher = ctx.teacher; S.subject = ctx.subject; S.grade = ctx.grade; S.section = ctx.section;
    const R = roster(); if (!R.length) { skipped += g.entries.length; return; }
    loadCtx();
    let n = 0;
    g.entries.forEach(e => {
      const st = R.find(x => (e.id && x.id === e.id) || (!e.id && x.name === e.name)) || R.find(x => x.name === e.name);
      if (!st) { skipped++; return; }
      S.rows[skey(st)] = e.row; n++;
    });
    total += n; lastCtx = ctx;
    S.mode = S.mode || "grid"; save(true);
  });
  if (!lastCtx) { toast(t("impBad")); return; }
  S.teacher = lastCtx.teacher; S.subject = lastCtx.subject; S.grade = lastCtx.grade; S.section = lastCtx.section;
  S.mode = S.mode || "grid"; S.cur = 0; save(true); render();
  toast(t("impOk").replace("{n}", total).replace("{c}", S.grade + "/" + S.section).replace("{s}", subjLabel(S.subject)) + (skipped ? " " + t("impSkip").replace("{n}", skipped) : ""));
}

/* =====================================================================
   الأحداث | EVENTS
   ===================================================================== */
function closePop() { const p = $("#qfpop"); p.style.display = "none"; p.innerHTML = ""; }
document.addEventListener("click", e => {
  const el = e.target;
  if (!el.closest("#qfpop") && !el.closest("[data-qfo]")) closePop();
  if (S.ddOpen && !el.closest(".dd")) { S.ddOpen = false; renderSingle(); return; }
  let b;
  if ((b = el.closest("[data-setmode]"))) { S.mode = b.dataset.setmode; S.ddOpen = false; save(); renderWork(); return; }
  if ((b = el.closest("[data-act]"))) {
    const a = b.dataset.act, R = roster();
    if (a === "download") return downloadBatch();
    if (a === "change") { save(true); S.mode = ""; S.loadedKey = ""; S.ddOpen = false; render(); return; }
    if (a === "dd") { S.ddOpen = !S.ddOpen; renderSingle(); return; }
    if (a === "prev") return goStudent(S.cur - 1);
    if (a === "next") return goStudent(S.cur + 1);
    if (a === "nextopen") { let i = R.findIndex((x, n) => n > S.cur && ["empty", "partial"].includes(statusOf(x))); if (i < 0) i = R.findIndex(x => ["empty", "partial"].includes(statusOf(x))); return goStudent(i < 0 ? S.cur : i); }
    if (a === "na") { toggleNA(R[S.cur]); renderSingle(); updateProgress(); return; }
    if (a === "expandall") { Object.keys(S.col).forEach(k => S.col[k] = false); save(); renderGrid(); return; }
    if (a === "collapseall") { Object.keys(S.col).forEach(k => S.col[k] = true); save(); renderGrid(); return; }
    if (a === "wide") { S.wide = b.checked; renderGrid(); return; }
  }
  if ((b = el.closest("[data-goto]"))) return goStudent(Number(b.dataset.goto));
  if ((b = el.closest("[data-set]"))) { const st = roster()[S.cur], r = rowOf(st); setAns(st, b.dataset.set, b.dataset.v); refreshSingle(); return; }
  if ((b = el.closest("[data-setf]"))) { const st = roster()[S.cur], r = rowOf(st); setFu(st, b.dataset.setf, b.dataset.v); refreshSingle(); return; }
  if ((b = el.closest("[data-qf]"))) { const st = roster()[S.cur], undo = quickFill(st, Number(b.dataset.qf)); renderSingle(); updateProgress(); toast(t("filledRow"), undo); return; }
  if ((b = el.closest("[data-tog]"))) { S.col[b.dataset.tog] = !S.col[b.dataset.tog]; save(); renderGrid(); return; }
  if ((b = el.closest("[data-sum]"))) { S.col[b.dataset.sum] = false; save(); renderGrid(); return; }
  if ((b = el.closest("[data-ca]"))) { const tr = b.closest("tr"), st = roster().find(x => skey(x) === tr.dataset.k); const r = rowOf(st); setAns(st, b.dataset.ca, cycle(r.a[b.dataset.ca], SCALE.map(x => x.key), e.shiftKey)); refreshRowDOM(tr.dataset.k); return; }
  if ((b = el.closest("[data-cf]"))) { const tr = b.closest("tr"), st = roster().find(x => skey(x) === tr.dataset.k); const f = FOLLOWUP.find(x => x.field === b.dataset.cf); setFu(st, f.field, cycle(rowOf(st).f[f.field], f.opts.map(o => o[0]), e.shiftKey)); refreshRowDOM(tr.dataset.k); return; }
  if ((b = el.closest("[data-nak]"))) { const st = roster().find(x => skey(x) === b.dataset.nak); toggleNA(st); refreshRowDOM(b.dataset.nak); return; }
  if ((b = el.closest("[data-qfo]"))) {
    const k = b.dataset.qfo, p = $("#qfpop"), rc = b.getBoundingClientRect();
    p.innerHTML = "<b>" + esc(t("fillRow")) + "</b>" + SCALE.map(sc => '<button class="qbtn l' + sc.level + '" data-qfr="' + SCALE.indexOf(sc) + '" data-k="' + esc(k) + '" type="button">' + esc(S.lang === "ar" ? sc.s[0] : sc.s[1]) + "</button>").join("");
    p.style.display = "block"; p.style.top = Math.min(window.innerHeight - p.offsetHeight - 8, rc.bottom + 4) + "px";
    p.style.left = Math.max(8, Math.min(window.innerWidth - p.offsetWidth - 8, rc.left)) + "px"; return;
  }
  if ((b = el.closest("[data-qfr]"))) { const k = b.dataset.k, st = roster().find(x => skey(x) === k), undo = quickFill(st, Number(b.dataset.qfr)); closePop(); refreshRowDOM(k); toast(t("filledRow"), undo); return; }
});
document.addEventListener("keydown", e => {   // لوحة المفاتيح في الجدول
  const b = e.target.closest && e.target.closest("[data-nav]"); if (!b) return;
  const td = b.closest("td"), tr = b.closest("tr"), st = roster().find(x => skey(x) === tr.dataset.k); if (!st) return;
  const cells = Array.from(tr.querySelectorAll("[data-nav]")), ci = cells.indexOf(b);
  const focusAt = (row, c) => { if (row) { const cs = row.querySelectorAll("[data-nav]"); if (cs[c]) cs[c].focus(); } };
  const rtl = S.lang === "ar";
  if (e.key === "ArrowDown") { e.preventDefault(); return focusAt(tr.nextElementSibling, ci); }
  if (e.key === "ArrowUp") { e.preventDefault(); return focusAt(tr.previousElementSibling, ci); }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); const step = (e.key === "ArrowLeft") === rtl ? 1 : -1; return cells[ci + step] && cells[ci + step].focus(); }
  let val = null;
  if (b.dataset.ca && /^[1-3]$/.test(e.key)) val = SCALE[Number(e.key) - 1].key;
  else if (b.dataset.cf && /^[1-2]$/.test(e.key)) { const f = FOLLOWUP.find(x => x.field === b.dataset.cf), o = f.opts[Number(e.key) - 1]; if (o) val = o[0]; }
  if (val !== null || e.key === "Backspace" || e.key === "Delete") {
    e.preventDefault(); const k = tr.dataset.k, code = b.dataset.ca || b.dataset.cf, f = b.dataset.cf;
    if (b.dataset.ca) setAns(st, code, val || ""); else setFu(st, f, val || "");
    const nextRow = tr.nextElementSibling; refreshRowDOM(k);
    if (val !== null && nextRow) { const nb = nextRow.querySelector('[data-ca="' + code + '"],[data-cf="' + code + '"]'); if (nb) nb.focus(); }
    else { const nb = document.querySelector('tr[data-k="' + CSS.escape(k) + '"] [data-ca="' + code + '"],tr[data-k="' + CSS.escape(k) + '"] [data-cf="' + code + '"]'); if (nb) nb.focus(); }
  }
});
$("#langBtn").onclick = () => { S.lang = S.lang === "ar" ? "en" : "ar"; save(); render(); };
$("#btnImportTop").onclick = () => $("#fileImport").click();
$("#fileImport").onchange = e => { importFiles(e.target.files); e.target.value = ""; };

(function init() {
  if (window.PQ_CLASSES && window.PQ_SUBJECTS) { try { buildDB(window.PQ_CLASSES, window.PQ_SUBJECTS); } catch (e) { DB.ready = false; } }
  const l = safeGet(LAST_KEY);
  if (l) { S.lang = l.lang || "ar"; if (DB.ready && DB.teachers[l.teacher]) { S.teacher = l.teacher; S.subject = l.subject || ""; S.grade = l.grade || ""; S.section = l.section || ""; if (!(DB.grades[S.grade] && DB.grades[S.grade][S.section])) { S.grade = ""; S.section = ""; } } }
  render();
})();
